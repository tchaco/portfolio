<!-- ==========================================================================
     Shared sidebar — intro + collapsible navigation + social
     Injected into every page via include.js. Edit once, updates everywhere.

     Layout differs by screen (see style.css):
       • Desktop : fixed left column; nav always visible; social pinned bottom.
       • Mobile  : stacked centred header; nav + social collapse behind the "+"
                   toggle and expand downward, pushing the page content down.

     The "+" is a pure-CSS toggle: a hidden checkbox (#nav-toggle) whose
     :checked state reveals the later siblings (.sidebar__nav and .social).
     They must stay DIRECT children of .sidebar, after the checkbox, for the
     `~` sibling selector to reach them — don't wrap them in another element.
     ========================================================================== -->
<aside class="sidebar">

  <!-- Always visible: avatar + intro -->
  <a href="https://tchaco.cc/Home" class="image-link">
    <img class="sidebar__avatar" src="assets_compressed/image_027_80695b78ec6f.jpg"
         width="1080" height="1080" alt="Thiago Da Costa">
  </a>

  <small class="sidebar__intro">
    Hey, I'm <b>Thiago Da Costa</b>, a Brazilian designer &amp; illustrator
    living in Brisbane, Australia.
  </small>

  <!-- Mobile-only collapse toggle (hidden on desktop). The label shows "+" /
       "–" via CSS; the checkbox holds the open/closed state. -->
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <label for="nav-toggle" class="nav-toggle__btn" aria-label="Toggle menu"></label>

  <!-- Collapsible navigation: quick links + category nav -->
  <div class="sidebar__nav">
